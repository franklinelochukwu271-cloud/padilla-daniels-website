
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Padilla Daniels website Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background-color: #080d24;
            background-image: url("./fa1e1772-bb78-4713-84da-42b2799d2d97.png");
            background-size: cover;
            background-position: center;
            display: flex;     
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            animation: welcomeMotion 5.2s ease-out;
            background-attachment: fixed;
        }

        .welcome {
            width: 100%;
            max-width: 500px;
        }

        .brand {
            color: #00c8ff;
            font-size: clamp(30px, 8vw, 48px);
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 22px rgba(0, 200, 255, 0.7);
            margin-bottom: 12px;
        }

        .line {
            width: 85px;
            height: 3px;
            margin: 20px auto;
            background: linear-gradient(90deg, #00c8ff, #0077ff);
            border-radius: 10px;
        }

        h1 {
            font-size: clamp(45px, 6vw, 36px);
            line-height: 1.3;
            margin: 20px 0 12px;
        }

        p {
            color: #dce7ff;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .start-button {
            display: inline-block;
            padding: 15px 34px;
            border-radius: 35px;
            background: linear-gradient(135deg, #00c8ff, #0077ff);
            color: Orange;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 25px rgba(0, 200, 255, 0.3);
        }

        .footer {
            margin-top: 45px;
            color: #aab8d4;
            font-size: 12px;
        }
        
        .logo-container img {
              width:105%;
              max-width: 405px;
              height: 480px;
              display:block;
              margin: 0 auto 20px;
              filter: brightness(1.4) drop-shadow(0 0 12px rgba(0, 200, 255, 0.10));
         }
         
         
@keyframes welcomeMotion {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo-container {
    animation: welcomeMotion 4.2s ease-out, logoFloat 3s ease-in-out 1.2s infinite;
}


h1 {
    animation: welcomeMotion 4.2s ease-out;
    animation-delay: 0.5s;
    animation-fill-mode: both;
}

p {
    animation: welcomeMotion 2.2s ease-out;
    animation-delay: 0.6s;
    animation-fill-mode: both;
}


@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

    </style>
</head>

<body>

     
      <div class="logo-container">
               <img src="./fc9d869b-578c-40aa-a56e-6ef1817e5242_1.png" alt="Padilla Daniels Logo">
        </div>

        <h1>Welcome to My Digital World</h1>
        🖥📱

        <p>
            Creative websites. Modern designs.
            Digital experiences built to help businesses stand out.
        </p>

        <a class="start-button" href="about.html">
            Get Started →
        </a>

        <div class="footer">
            WEB DESIGN · CREATIVITY · INNOVATION
        </div>
           <div class="footer">
            ELOCHUKWU · FRANKLIN · OFFORDILE
        </div>
    </main>
</body>
</html>
